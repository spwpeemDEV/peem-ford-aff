<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow AI Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <!-- ส่วน Header -->
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">Flow Launcher</span>
        </div>
        <span id="versionLabel" class="version-pill">v—</span>
      </header>

      <!-- ส่วนที่ 1: ตั้งค่าโปรเจกต์ (Flow AI) -->
      <section class="workflow-card" aria-label="ตั้งค่าการสร้างภาพและวิดีโอ">
        <div class="card-heading">
          <div>
            <p class="section-kicker">NEW CREATION</p>
            <h2>ตั้งค่าโปรเจกต์</h2>
          </div>
          <span class="flow-chip">IMAGE <i>→</i> VIDEO</span>
        </div>

        <div class="automation-form">
          <div class="product-list-heading">
            <span>
              <span class="heading-line">
                <strong>รายการสินค้า</strong>
                <span id="productCount" class="count-pill">1 / 10</span>
              </span>
              <small>เพิ่มสินค้าและกรอกข้อมูลให้ครบทั้ง 3 ขั้นตอน</small>
            </span>
            <button id="addProduct" class="add-product-button" type="button">
              <span aria-hidden="true">＋</span>
              เพิ่มสินค้า
            </button>
          </div>

          <div class="product-table" aria-label="ตารางรายการสินค้า">
            <div class="product-table-head" aria-hidden="true">
              <span>สินค้า</span>
              <span>สถานะ</span>
              <span>จัดการ</span>
            </div>
            <div id="productList" class="product-list"></div>
          </div>

          <label class="field compact-field loop-field" for="loopCount">
            <span>
              <strong>จำนวนลูป</strong>
              <small>1 ลูป = ทำสินค้าทุกตัวตามลำดับหนึ่งครั้ง</small>
            </span>
            <select id="loopCount" aria-label="จำนวนลูปที่ต้องการสร้าง">
              <option value="1" selected>1 ลูป</option>
              <option value="2">2 ลูป</option>
              <option value="3">3 ลูป</option>
              <option value="4">4 ลูป</option>
            </select>
          </label>
          <div id="jobSummary" class="job-summary" aria-live="polite">
            <span>งานทั้งหมด</span>
            <strong>1 สินค้า × 1 ลูป = 1 คลิป</strong>
          </div>
        </div>
      </section>

      <template id="productTemplate">
        <article class="product-row" data-expanded="true">
          <header class="product-row-header">
            <span class="product-identity">
              <span class="product-index" data-role="product-index">1</span>
              <span class="product-name">
                <strong data-role="product-title">สินค้า 1</strong>
                <small data-role="product-summary">ยังกรอกข้อมูลไม่ครบ</small>
              </span>
            </span>
            <span class="product-status" data-role="product-status" data-state="incomplete">0 / 3</span>
            <span class="product-actions">
              <button
                data-action="toggle-product"
                class="toggle-product"
                type="button"
                aria-expanded="true"
                aria-label="ย่อรายละเอียดสินค้า"
              >
                <span data-role="toggle-label">ย่อ</span>
                <span class="toggle-caret" aria-hidden="true">⌃</span>
              </button>
              <button
                data-action="remove-product"
                class="remove-product"
                type="button"
                aria-label="ลบสินค้า"
              >×</button>
            </span>
          </header>
          <div class="product-editor" data-role="product-editor">
            <label class="field upload-field">
              <span class="field-heading">
                <span class="step-number">01</span>
                <span><strong>รูปภาพอ้างอิง</strong><small>PNG, JPG หรือ WEBP · ไม่เกิน 20 MB</small></span>
              </span>
              <span class="file-picker">
                <span class="preview-shell">
                  <img data-role="image-preview" alt="ตัวอย่างรูปสินค้า" hidden />
                  <span data-role="upload-icon" class="upload-icon" aria-hidden="true">＋</span>
                </span>
                <span class="file-copy"><strong data-role="file-name">เลือกรูปภาพ</strong><small>คลิกเพื่อเลือกไฟล์จากเครื่อง</small></span>
                <span class="picker-arrow" aria-hidden="true">›</span>
              </span>
              <input data-role="image-input" type="file" accept="image/png,image/jpeg,image/webp" />
            </label>
            <label class="field">
              <span class="field-heading"><span class="step-number">02</span><span><strong>Image Prompt</strong><small>อธิบายภาพของสินค้านี้</small></span></span>
              <span class="input-shell"><textarea data-role="image-prompt" rows="3" placeholder="อธิบายภาพที่ต้องการสร้าง…"></textarea><span class="input-tag">9:16 · NANO BANANA 2</span></span>
            </label>
            <label class="field">
              <span class="field-heading"><span class="step-number">03</span><span><strong>Video Prompt</strong><small>กำหนดการเคลื่อนไหวของสินค้านี้</small></span></span>
              <span class="input-shell"><textarea data-role="video-prompt" rows="3" placeholder="อธิบายการเคลื่อนไหวและมุมกล้อง…"></textarea><span class="input-tag">VEO 3.1 LITE · 8S</span></span>
            </label>
          </div>
        </article>
      </template>

      <!-- ส่วนที่ 2: แสดงสถานะการทำงาน (Flow AI) -->
      <section id="statusCard" class="status-card" data-state="idle" hidden>
        <div class="status-heading">
          <span class="status-label"><i></i> PROCESS</span>
          <span id="statusPercent">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="statusProgress"></span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <!-- ส่วนที่ 3: ปุ่มเริ่ม/ยกเลิก (Flow AI) -->
      <div class="action-dock">
        <button id="startPrompt" class="primary-button" type="button">
          <span>
            <small>START AUTOMATION</small>
            สร้างรูปและวิดีโอใน Flow
          </span>
          <span class="button-icon" aria-hidden="true">→</span>
        </button>
        <button
          id="cancelAutomation"
          class="cancel-button"
          type="button"
          hidden
        >
          <span>ยกเลิกการทำงาน</span>
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <!-- ส่วนที่ 4: ซิงก์ข้อมูล TikTok (ปรับดีไซน์ใหม่) -->
      <section class="workflow-card" aria-label="ซิงก์ข้อมูล TikTok">
        <div class="card-heading">
          <div>
            <p class="section-kicker">TIKTOK SYNC</p>
            <h2>ดึงข้อมูลสินค้า</h2>
          </div>
        </div>

        <div class="automation-form">
          <label class="field compact-field" for="syncMaxPages">
            <span>
              <strong>จำนวนหน้าที่ต้องการดึง</strong>
              <small>ระบุจำนวนหน้า (1-100)</small>
            </span>
            <span class="input-shell" style="width: 80px; text-align: center">
              <input
                type="number"
                id="syncMaxPages"
                value="5"
                min="1"
                max="100"
                style="
                  width: 100%;
                  background: transparent;
                  border: none;
                  color: #fff;
                  text-align: center;
                  font-size: 14px;
                  outline: none;
                "
              />
            </span>
          </label>

          <!-- ข้อความบอกสถานะ TikTok Sync -->
          <div
            id="tiktokSyncStatus"
            style="
              font-size: 12px;
              color: #60a5fa;
              margin-top: 4px;
              margin-bottom: 8px;
              text-align: center;
              display: none;
            "
          ></div>

          <!-- พื้นที่แสดงผลรายการสินค้า -->
          <div
            id="tiktokIdOutput"
            style="
              width: 100%;
              max-height: 250px;
              overflow-y: auto;
              background: #18181b;
              border: 1px solid #3f3f46;
              border-radius: 8px;
              display: none;
              flex-direction: column;
              gap: 8px;
              padding: 8px;
            "
          ></div>
        </div>

        <!-- กลุ่มปุ่มการทำงาน (TikTok Sync) -->
        <div class="action-dock" style="margin-top: 16px">
          <button
            id="syncTiktokBtn"
            class="primary-button"
            type="button"
            style="flex: 1"
          >
            <span>
              <small>START SCRAPING</small>
              เริ่มกวาดข้อมูล
            </span>
          </button>

          <button
            id="cancelSyncBtn"
            class="cancel-button"
            type="button"
            style="flex: 1; display: none"
          >
            <span>ยกเลิกการดึง</span>
            <span aria-hidden="true">×</span>
          </button>

          <button
            id="clearSyncBtn"
            class="cancel-button"
            type="button"
            style="
              flex: 0 0 auto;
              background: transparent;
              border: 1px solid #3f3f46;
              color: #d4d4d8;
            "
            title="ล้างรายการทั้งหมด"
          >
            <span>ล้าง</span>
          </button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
