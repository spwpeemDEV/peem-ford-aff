<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow AI Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <!-- ส่วน Header -->
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span class="brand-name">Flow Launcher</span>
        </div>
        <span id="versionLabel" class="version-pill">v—</span>
      </header>

      <!-- ส่วนที่ 1: ตั้งค่าโปรเจกต์ (Flow AI) -->
      <section class="workflow-card" aria-label="ตั้งค่าการสร้างภาพและวิดีโอ">
        <div class="card-heading">
          <div>
            <p class="section-kicker">NEW CREATION</p>
            <h2>ตั้งค่าโปรเจกต์</h2>
          </div>
          <span class="flow-chip">IMAGE <i>→</i> VIDEO</span>
        </div>

        <div class="automation-form">
          <label class="field upload-field" for="imageInput">
            <span class="field-heading">
              <span class="step-number">01</span>
              <span>
                <strong>รูปภาพอ้างอิง</strong>
                <small>PNG, JPG หรือ WEBP · ไม่เกิน 20 MB</small>
              </span>
            </span>
            <span class="file-picker">
              <span class="preview-shell">
                <img id="imagePreview" alt="ตัวอย่างรูปภาพที่เลือก" hidden />
                <span id="uploadIcon" class="upload-icon" aria-hidden="true"
                  >＋</span
                >
              </span>
              <span class="file-copy">
                <strong id="fileName">เลือกรูปภาพ</strong>
                <small>คลิกเพื่อเลือกไฟล์จากเครื่อง</small>
              </span>
              <span class="picker-arrow" aria-hidden="true">›</span>
            </span>
            <input
              id="imageInput"
              type="file"
              accept="image/png,image/jpeg,image/webp"
            />
          </label>

          <label class="field" for="imagePrompt">
            <span class="field-heading">
              <span class="step-number">02</span>
              <span>
                <strong>Image Prompt</strong>
                <small>อธิบายภาพที่ต้องการสร้าง</small>
              </span>
            </span>
            <span class="input-shell">
              <textarea
                id="imagePrompt"
                rows="4"
                placeholder="เช่น เปลี่ยนสินค้าในภาพให้เป็นโฆษณาสไตล์มินิมอล…"
              ></textarea>
              <span class="input-tag">9:16 · NANO BANANA 2</span>
            </span>
          </label>

          <label class="field" for="videoPrompt">
            <span class="field-heading">
              <span class="step-number">03</span>
              <span>
                <strong>Video Prompt</strong>
                <small>กำหนดการเคลื่อนไหวและมุมกล้อง</small>
              </span>
            </span>
            <span class="input-shell">
              <textarea
                id="videoPrompt"
                rows="4"
                placeholder="เช่น กล้องค่อย ๆ ซูมเข้า แสงนุ่มนวล เคลื่อนไหวสมจริง…"
              ></textarea>
              <span class="input-tag">VEO 3.1 LITE · 8S</span>
            </span>
          </label>

          <label class="field compact-field" for="outputCount">
            <span>
              <strong>จำนวนรูปภาพ</strong>
              <small>เลือกรูปที่จะสร้างในรอบแรก</small>
            </span>
            <select id="outputCount" aria-label="จำนวนรูปภาพที่ต้องการสร้าง">
              <option value="1" selected>x1 — 1 รูป</option>
              <option value="2">x2 — 2 รูป</option>
              <option value="3">x3 — 3 รูป</option>
              <option value="4">x4 — 4 รูป</option>
            </select>
          </label>
        </div>
      </section>

      <!-- ส่วนที่ 2: แสดงสถานะการทำงาน (Flow AI) -->
      <section id="statusCard" class="status-card" data-state="idle" hidden>
        <div class="status-heading">
          <span class="status-label"><i></i> PROCESS</span>
          <span id="statusPercent">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true">
          <span id="statusProgress"></span>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <!-- ส่วนที่ 3: ปุ่มเริ่ม/ยกเลิก (Flow AI) -->
      <div class="action-dock">
        <button id="startPrompt" class="primary-button" type="button">
          <span>
            <small>START AUTOMATION</small>
            สร้างรูปและวิดีโอใน Flow
          </span>
          <span class="button-icon" aria-hidden="true">→</span>
        </button>
        <button
          id="cancelAutomation"
          class="cancel-button"
          type="button"
          hidden
        >
          <span>ยกเลิกการทำงาน</span>
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <!-- ส่วนที่ 4: ซิงก์ข้อมูล TikTok (ปรับดีไซน์ใหม่) -->
      <section class="workflow-card" aria-label="ซิงก์ข้อมูล TikTok">
        <div class="card-heading">
          <div>
            <p class="section-kicker">TIKTOK SYNC</p>
            <h2>ดึงข้อมูลสินค้า</h2>
          </div>
        </div>

        <div class="automation-form">
          <label class="field compact-field" for="syncMaxPages">
            <span>
              <strong>จำนวนหน้าที่ต้องการดึง</strong>
              <small>ระบุจำนวนหน้า (1-100)</small>
            </span>
            <span class="input-shell" style="width: 80px; text-align: center">
              <input
                type="number"
                id="syncMaxPages"
                value="5"
                min="1"
                max="100"
                style="
                  width: 100%;
                  background: transparent;
                  border: none;
                  color: #fff;
                  text-align: center;
                  font-size: 14px;
                  outline: none;
                "
              />
            </span>
          </label>

          <!-- ข้อความบอกสถานะ TikTok Sync -->
          <div
            id="tiktokSyncStatus"
            style="
              font-size: 12px;
              color: #60a5fa;
              margin-top: 4px;
              margin-bottom: 8px;
              text-align: center;
              display: none;
            "
          ></div>

          <!-- พื้นที่แสดงผลรายการสินค้า -->
          <div
            id="tiktokIdOutput"
            style="
              width: 100%;
              max-height: 250px;
              overflow-y: auto;
              background: #18181b;
              border: 1px solid #3f3f46;
              border-radius: 8px;
              display: none;
              flex-direction: column;
              gap: 8px;
              padding: 8px;
            "
          ></div>
        </div>

        <!-- กลุ่มปุ่มการทำงาน (TikTok Sync) -->
        <div class="action-dock" style="margin-top: 16px">
          <button
            id="syncTiktokBtn"
            class="primary-button"
            type="button"
            style="flex: 1"
          >
            <span>
              <small>START SCRAPING</small>
              เริ่มกวาดข้อมูล
            </span>
          </button>

          <button
            id="cancelSyncBtn"
            class="cancel-button"
            type="button"
            style="flex: 1; display: none"
          >
            <span>ยกเลิกการดึง</span>
            <span aria-hidden="true">×</span>
          </button>

          <button
            id="clearSyncBtn"
            class="cancel-button"
            type="button"
            style="
              flex: 0 0 auto;
              background: transparent;
              border: 1px solid #3f3f46;
              color: #d4d4d8;
            "
            title="ล้างรายการทั้งหมด"
          >
            <span>ล้าง</span>
          </button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
